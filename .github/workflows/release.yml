# Builds the Paradoxiie Launcher for Windows and publishes it as a release here, where the launcher
# looks for its own updates. Runs when the version in package.json changes, or by hand from the Actions tab.
name: Build and release the launcher

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, src/**, build/**, electron-builder.yml, electron.vite.config.ts, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: what
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$assets" | grep -q '^latest.yml$' && echo "$assets" | grep -q 'setup.exe$'; then
            echo "v$version is already released: bump the version in package.json to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.what.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.what.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.what.outputs.skip != 'true'
        run: npm run build

      - name: Build the installer
        if: steps.what.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win nsis --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 15 "$RUNNER_TEMP/build.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -la dist

      - name: Publish the release
        if: steps.what.outputs.skip != 'true'
        shell: bash
        run: |
          version="${{ steps.what.outputs.version }}"
          tag="v$version"
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          files=(dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; done
          notes="Download **$(basename dist/*-setup.exe)** below and run it. It installs without admin rights, puts a shortcut on the desktop and keeps itself (and your games) up to date."
          ok=0
          for try in 1 2 3; do
            if gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --title "Paradoxiie Launcher v$version" --notes "$notes" --latest 2> err.txt; then ok=1; break; fi
            echo "::warning::try $try: $(tr '\n' ' ' < err.txt)"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            sleep 10
          done
          [ $ok = 1 ] || { echo "::error::could not publish: $(tr '\n' ' ' < err.txt)"; exit 1; }

      - name: Keep only the newest two releases
        if: steps.what.outputs.skip != 'true'
        shell: bash
        run: |
          version="${{ steps.what.outputs.version }}"
          kept=0
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | while read -r tag; do
            if [ "$tag" = "v$version" ]; then continue; fi
            kept=$((kept + 1))
            if [ "$kept" -le 1 ]; then continue; fi
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
